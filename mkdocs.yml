site_name: mkcert for Mere Mortals
site_description: A certificate authority of your own for local development. Installing a root your tools will trust, issuing certificates for localhost and test names, serving HTTPS on your own machine without warnings, and removing the authority cleanly afterwards, with the limits stated plainly.
